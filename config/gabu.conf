# Gabu Linux - configuração central (lida por todos os scripts)
GABU_NAME="Gabu Linux"
GABU_VERSION="0.1.0"
GABU_HOSTNAME="gabu"
GABU_USER="gabu"
GABU_PASSWORD="gabu"            # SÓ PARA DESENVOLVIMENTO (root e utilizador)
GABU_TZ="Europe/Lisbon"
GABU_LOCALE="pt_PT.UTF-8"
GABU_KEYMAP="pt-latin1"
GABU_DISK_ID="47414255"         # MBR disk-id ("GABU" em hex) -> PARTUUID=47414255-01

LFS="${LFS:-/lfs}"              # onde o sistema é construído (no host/CI)
LFS_TGT="x86_64-lfs-linux-gnu"

# Onde estão as listas oficiais de fontes do livro LFS (tentadas por ordem)
LFS_BOOK_BASES=(
  "https://www.linuxfromscratch.org/lfs/view/stable-systemd"
  "https://www.linuxfromscratch.org/lfs/view/stable"
  "https://www.linuxfromscratch.org/lfs/view/13.1"
)
LFS_MIRRORS=(
  "https://ftp.lfs-matrix.net/pub/lfs/lfs-packages/13.1"
)

MATE_SERIES="1.28"              # série estável do MATE
