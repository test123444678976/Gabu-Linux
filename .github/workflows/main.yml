name: Gabu Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      desktop:
        description: 'Compilar também Xorg + MATE (várias horas)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  LFS: /lfs

# Cada job fica abaixo do limite de 6 h do GitHub; o estado passa entre jobs como tar.zst.
# Se um job falhar, "Re-run failed jobs" retoma sem refazer os anteriores.
jobs:
  toolchain:
    name: 1 - LFS toolchain (caps. 5-6)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh free-space
      - run: sudo -E bash scripts/host-prepare.sh
      - run: bash scripts/ci.sh sync
      - run: sudo -E bash scripts/fetch-sources.sh
      - run: sudo -E bash /lfs/gabu/scripts/stage1-toolchain.sh
      - run: bash scripts/ci.sh save "$RUNNER_TEMP/state.tar.zst"
      - uses: actions/upload-artifact@v4
        with: { name: state-toolchain, path: '${{ runner.temp }}/state.tar.zst', compression-level: 0, retention-days: 2 }
      - if: always()
        run: bash scripts/ci.sh logs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-toolchain, path: /lfs/.gabu/logs, if-no-files-found: ignore }

  system:
    name: 2 - Sistema LFS (caps. 7-8)
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh free-space
      - uses: actions/download-artifact@v4
        with: { name: state-toolchain, path: '${{ runner.temp }}/in' }
      - run: bash scripts/ci.sh restore "$RUNNER_TEMP/in/state.tar.zst"
      - run: rm -rf "$RUNNER_TEMP/in"
      - run: bash scripts/ci.sh sync
      - run: bash scripts/ci.sh chroot stage2-chroot-tools.sh
      - run: bash scripts/ci.sh chroot stage3-lfs-system.sh
      - run: bash scripts/ci.sh save "$RUNNER_TEMP/state.tar.zst"
      - uses: actions/upload-artifact@v4
        with: { name: state-system, path: '${{ runner.temp }}/state.tar.zst', compression-level: 0, retention-days: 2 }
      - if: always()
        run: bash scripts/ci.sh logs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-system, path: /lfs/.gabu/logs, if-no-files-found: ignore }

  core:
    name: 3 - Kernel, configuração, dpkg + apt
    needs: system
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh free-space
      - uses: actions/download-artifact@v4
        with: { name: state-system, path: '${{ runner.temp }}/in' }
      - run: bash scripts/ci.sh restore "$RUNNER_TEMP/in/state.tar.zst"
      - run: rm -rf "$RUNNER_TEMP/in"
      - run: bash scripts/ci.sh sync
      - run: bash scripts/ci.sh chroot stage4-configure.sh
      - run: sudo -E bash scripts/fetch-extra.sh apt
      - run: bash scripts/ci.sh chroot stage5-packages.sh apt
      - run: bash scripts/ci.sh save "$RUNNER_TEMP/state.tar.zst"
      - uses: actions/upload-artifact@v4
        with: { name: state-core, path: '${{ runner.temp }}/state.tar.zst', compression-level: 0, retention-days: 3 }
      - if: always()
        run: bash scripts/ci.sh logs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-core, path: /lfs/.gabu/logs, if-no-files-found: ignore }

  image-core:
    name: 4 - Imagem core + teste QEMU
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh free-space
      - run: sudo -E bash scripts/host-prepare.sh
      - uses: actions/download-artifact@v4
        with: { name: state-core, path: '${{ runner.temp }}/in' }
      - run: bash scripts/ci.sh restore "$RUNNER_TEMP/in/state.tar.zst"
      - run: rm -rf "$RUNNER_TEMP/in"
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - run: sudo -E bash scripts/make-image.sh core
      - run: sudo -E bash scripts/qemu-test.sh core out/gabu-core-0.1.0.img
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: qemu-core-logs, path: out/*.log, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with: { name: image-core, path: out/*.qcow2, compression-level: 0 }

  desktop-base:
    name: 5 - Xorg + GTK3 (BLFS)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.desktop }}
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh free-space
      - uses: actions/download-artifact@v4
        with: { name: state-core, path: '${{ runner.temp }}/in' }
      - run: bash scripts/ci.sh restore "$RUNNER_TEMP/in/state.tar.zst"
      - run: rm -rf "$RUNNER_TEMP/in"
      - run: bash scripts/ci.sh sync
      - name: Xorg libs, GFX, servidor X
        run: |
          for s in xorg-libs gfx xserver; do
            sudo -E bash scripts/fetch-extra.sh "$s"
            bash scripts/ci.sh chroot stage5-packages.sh "$s"
          done
      - run: bash scripts/ci.sh save "$RUNNER_TEMP/state.tar.zst"
      - uses: actions/upload-artifact@v4
        with: { name: state-desktop-base, path: '${{ runner.temp }}/state.tar.zst', compression-level: 0, retention-days: 3 }
      - if: always()
        run: bash scripts/ci.sh logs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-desktop-base, path: /lfs/.gabu/logs, if-no-files-found: ignore }

  desktop-mate:
    name: 6 - MATE
    needs: desktop-base
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh free-space
      - uses: actions/download-artifact@v4
        with: { name: state-desktop-base, path: '${{ runner.temp }}/in' }
      - run: bash scripts/ci.sh restore "$RUNNER_TEMP/in/state.tar.zst"
      - run: rm -rf "$RUNNER_TEMP/in"
      - run: bash scripts/ci.sh sync
      - run: sudo -E bash scripts/fetch-extra.sh mate
      - run: bash scripts/ci.sh chroot stage5-packages.sh mate
      - run: bash scripts/ci.sh save "$RUNNER_TEMP/state.tar.zst"
      - uses: actions/upload-artifact@v4
        with: { name: state-desktop, path: '${{ runner.temp }}/state.tar.zst', compression-level: 0, retention-days: 3 }
      - if: always()
        run: bash scripts/ci.sh logs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-desktop-mate, path: /lfs/.gabu/logs, if-no-files-found: ignore }

  image-desktop:
    name: 7 - Imagem desktop + teste QEMU (MATE)
    needs: desktop-mate
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci.sh free-space
      - run: sudo -E bash scripts/host-prepare.sh
      - uses: actions/download-artifact@v4
        with: { name: state-desktop, path: '${{ runner.temp }}/in' }
      - run: bash scripts/ci.sh restore "$RUNNER_TEMP/in/state.tar.zst"
      - run: rm -rf "$RUNNER_TEMP/in"
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - run: sudo -E bash scripts/make-image.sh desktop
      - run: sudo -E bash scripts/qemu-test.sh core out/gabu-desktop-0.1.0.img
      - run: sudo -E bash scripts/qemu-test.sh desktop out/gabu-desktop-0.1.0.img
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: qemu-desktop-logs, path: 'out/*.log
out/*.png', if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with: { name: image-desktop, path: out/*.qcow2, compression-level: 0 }

  release:
    name: Publicar release
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.image-core.result == 'success' }}
    needs: [image-core, image-desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'image-*', path: dl, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: 'dl/*.qcow2' }
